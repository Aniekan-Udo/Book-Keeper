# Local development:   docker compose up --build              → http://localhost:8001
# Server (pilot/prod): docker compose --profile production up -d --build
#                      → https://$DOMAIN via Caddy (automatic HTTPS)
#
# Postgres, FalkorDB and the app are only reachable from the machine itself (127.0.0.1);
# the internet only ever talks to Caddy on 80/443.
# FalkorDB Browser (graph explorer): http://localhost:3000, connect to falkordb:6379 /
# localhost:6379 from the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    # pinned by digest: the graph engine's behaviour (Cypher, constraints) shouldn't change
    # under us on a rebuild. To upgrade: pull the new image, run the tests, update the digest.
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    restart: unless-stopped
    environment:
      BROWSER: ${FALKORDB_BROWSER:-1}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GRAPH_MEMORY: ${GRAPH_MEMORY:-falkordb}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-30}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-90}
      LLM_MODEL: ${LLM_MODEL:-groq:openai/gpt-oss-120b}
      CURATOR_MODEL: ${CURATOR_MODEL:-}
      LLM_TURN_TIMEOUT: ${LLM_TURN_TIMEOUT:-90}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-false}
      VISION_MODEL: ${VISION_MODEL:-groq:qwen/qwen3.8-27b}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-groq:whisper-large-v3}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_DISPLAY_NUMBER: ${WHATSAPP_DISPLAY_NUMBER:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      WHATSAPP_REMINDER_TEMPLATE: ${WHATSAPP_REMINDER_TEMPLATE:-}
      WHATSAPP_REMINDER_TEMPLATE_LANG: ${WHATSAPP_REMINDER_TEMPLATE_LANG:-en}
      REMINDER_COOLDOWN_DAYS: ${REMINDER_COOLDOWN_DAYS:-3}
      REMINDER_DAILY_LIMIT: ${REMINDER_DAILY_LIMIT:-20}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-book-keeper}
      OPIK_URL_OVERRIDE: ${OPIK_URL_OVERRIDE:-}
    depends_on:
      postgres:
        condition: service_healthy
      # started, not healthy: the app runs without the graph if it has to
      falkordb:
        condition: service_started

  caddy:
    image: caddy:2
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  falkordb_data:
  caddy_data:
  caddy_config:
