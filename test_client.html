<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Book-Keeper — Test Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d14;
      --surface:   #13161f;
      --surface2:  #1c2030;
      --border:    #252a3a;
      --accent:    #e8a325;
      --accent-dim:#b37d18;
      --text:      #e8eaf0;
      --text-muted:#6b7280;
      --user-bubble: #1d3461;
      --ai-bubble:   #1c2030;
      --red:       #ef4444;
      --green:     #22c55e;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    .layout { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 260px; min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 24px 16px; gap: 24px;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .logo-text { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .logo-sub  { font-size: 11px; color: var(--text-muted); }

    .sidebar-section label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
    }

    .sidebar-section input {
      width: 100%; padding: 8px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    .sidebar-section input:focus { border-color: var(--accent); }

    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted); margin-right: 6px; vertical-align: middle; transition: background .3s;
    }
    .status-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red);   }
    #status-text { font-size: 12px; color: var(--text-muted); }

    .sidebar-section.examples { flex: 1; overflow-y: auto; }
    .example-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .chip-grid { display: flex; flex-direction: column; gap: 6px; }
    .chip {
      padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4;
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; transition: background .15s, border-color .15s;
      text-align: left; color: var(--text); font-family: inherit;
    }
    .chip:hover { background: var(--border); border-color: var(--accent); }

    .clear-btn {
      width: 100%; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 500;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .clear-btn:hover { background: var(--surface2); color: var(--text); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .messages {
      flex: 1; overflow-y: auto; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .bubble-row { display: flex; gap: 10px; max-width: 720px; }
    .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.ai   { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    }
    .ai .avatar   { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #000; font-size: 13px; }
    .user .avatar { background: var(--user-bubble); color: var(--text); font-size: 12px; }

    .bubble {
      padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6;
      max-width: 560px; word-break: break-word; white-space: pre-wrap;
    }
    .ai   .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
    .user .bubble { background: var(--user-bubble); border-top-right-radius: 4px; }
    .bubble-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; padding: 0 4px; }
    .user .bubble-meta { text-align: right; }

    /* Typing */
    .typing .bubble { padding: 14px 18px; }
    .dots { display: flex; gap: 4px; align-items: center; height: 16px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); animation: dot-pulse 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(.7); opacity: .4; }
      40%            { transform: scale(1);  opacity: 1;  }
    }

    /* Clarification card */
    .clarify-card {
      background: var(--surface2); border: 1px solid var(--accent);
      border-radius: 12px; padding: 14px 16px; margin-top: 8px;
      display: flex; flex-direction: column; gap: 10px; max-width: 340px;
    }
    .clarify-title { font-size: 12px; font-weight: 600; color: var(--accent); }
    .clarify-msg   { font-size: 13px; color: var(--text); }
    .clarify-row   { display: flex; gap: 8px; }
    .clarify-row input {
      flex: 1; padding: 8px 10px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-family: inherit; outline: none;
    }
    .clarify-row input:focus { border-color: var(--accent); }
    .clarify-submit {
      padding: 8px 14px; border-radius: 8px; background: var(--accent);
      border: none; color: #000; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .clarify-submit:hover { opacity: .85; }

    /* Input bar */
    .input-bar {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border); background: var(--surface);
    }
    .input-inner {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 8px 8px 14px; transition: border-color .15s;
    }
    .input-inner:focus-within { border-color: var(--accent); }
    #msg-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: inherit;
      resize: none; max-height: 120px; line-height: 1.5; padding: 4px 0;
    }
    #msg-input::placeholder { color: var(--text-muted); }
    #send-btn {
      width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s, transform .1s;
    }
    #send-btn:hover  { opacity: .9; }
    #send-btn:active { transform: scale(.94); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; }
    #send-btn svg { width: 16px; height: 16px; fill: #000; }

    .hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #3b1818; border: 1px solid var(--red);
      color: #fca5a5; border-radius: 10px; padding: 12px 16px;
      font-size: 13px; max-width: 320px; line-height: 1.5;
      animation: slide-in .2s ease; z-index: 100;
    }
    @keyframes slide-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--text-muted); padding: 40px;
    }
    .empty-icon  { font-size: 48px; opacity: .4; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty-sub   { font-size: 13px; text-align: center; max-width: 380px; line-height: 1.6; }

    .sidebar-section.examples::-webkit-scrollbar { width: 3px; }
    .sidebar-section.examples::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Mobile responsive layout */
    .mobile-header-toggle {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .sidebar-body {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      overflow-y: auto;
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }
      .sidebar {
        width: 100%;
        min-width: 0;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 14px 16px;
        gap: 0;
      }
      .logo {
        justify-content: space-between;
        width: 100%;
      }
      .mobile-header-toggle {
        display: block;
      }
      .sidebar-body {
        display: none;
        max-height: 50vh;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .sidebar-body.open {
        display: flex;
      }
      .messages {
        padding: 16px 12px;
      }
      .input-bar {
        padding: 12px 12px 16px;
      }
      .bubble-row {
        max-width: 100%;
      }
      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-icon">&#128210;</div>
        <div>
          <div class="logo-text">AI Book-Keeper</div>
          <div class="logo-sub">Test Client</div>
        </div>
      </div>
      <button class="mobile-header-toggle" onclick="toggleSidebarMenu()">☰ Menu</button>
    </div>

    <div class="sidebar-body" id="sidebar-body">
      <div class="sidebar-section">
        <label>API Base URL</label>
        <input id="api-url" type="text" value="http://localhost:8000" placeholder="http://localhost:8000" />
      </div>

      <div class="sidebar-section">
        <label>User ID</label>
        <input id="user-id" type="number" value="1" min="1" placeholder="e.g. 1" />
      </div>

      <div class="sidebar-section">
        <label>Connection</label>
        <div style="margin-bottom:8px;">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Not checked</span>
        </div>
        <button class="chip" onclick="pingServer()">Check connection</button>
      </div>

      <div class="sidebar-section examples">
        <div class="example-label">Try these</div>
        <div class="chip-grid">
          <button class="chip" onclick="fillPrompt(this)">I sold 20 bags of rice to Ahmed for 150k</button>
          <button class="chip" onclick="fillPrompt(this)">Paid 45,000 for fuel today</button>
          <button class="chip" onclick="fillPrompt(this)">I borrowed 200k from Emeka to buy stock</button>
          <button class="chip" onclick="fillPrompt(this)">James paid me back 80k</button>
          <button class="chip" onclick="fillPrompt(this)">What's my PnL for this month?</button>
          <button class="chip" onclick="fillPrompt(this)">Show me my expenses this week</button>
          <button class="chip" onclick="fillPrompt(this)">Who still owes me money?</button>
          <button class="chip" onclick="fillPrompt(this)">What did I spend on fuel last month?</button>
        </div>
      </div>

      <button class="clear-btn" onclick="clearChat()">Clear conversation</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">&#128210;</div>
        <div class="empty-title">Ready to test</div>
        <div class="empty-sub">Send a message to the AI bookkeeper. Try logging a sale, recording an expense, or asking for a P&amp;L report.</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-inner">
        <textarea id="msg-input" rows="1"
          placeholder="e.g. I sold 50 bags of rice for 200k..."
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter for new line &nbsp;&middot;&nbsp; No login required for testing</div>
    </div>
  </div>

</div>

<script>
  function getApiUrl() { return document.getElementById('api-url').value.replace(/\/$/, ''); }
  function getUserId() { return parseInt(document.getElementById('user-id').value, 10) || 1; }
  function now()       { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
  function uid()       { return Math.random().toString(36).slice(2); }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function fillPrompt(btn) {
    const input = document.getElementById('msg-input');
    input.value = btn.textContent.trim();
    autoResize(input);
    input.focus();
  }

  function clearChat() {
    const box = document.getElementById('messages');
    box.innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">&#128210;</div>
        <div class="empty-title">Ready to test</div>
        <div class="empty-sub">Send a message to the AI bookkeeper. Try logging a sale, recording an expense, or asking for a P&amp;L report.</div>
      </div>`;
  }

  function scrollBottom() {
    const box = document.getElementById('messages');
    box.scrollTop = box.scrollHeight;
  }

  function hideEmpty() {
    const e = document.getElementById('empty-state');
    if (e) e.remove();
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addBubble(role, text) {
    hideEmpty();
    const box = document.getElementById('messages');
    const isUser = role === 'user';
    const row = document.createElement('div');
    row.className = 'bubble-row ' + role;
    row.innerHTML = `
      <div class="avatar">${isUser ? 'U' : '&#128210;'}</div>
      <div>
        <div class="bubble">${escHtml(text)}</div>
        <div class="bubble-meta">${now()}</div>
      </div>`;
    box.appendChild(row);
    scrollBottom();
    return row;
  }

  function addTyping() {
    hideEmpty();
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'bubble-row ai typing';
    row.id = 'typing-indicator';
    row.innerHTML = `
      <div class="avatar">&#128210;</div>
      <div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div></div>`;
    box.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function addClarifyCard(clarifications) {
    const box = document.getElementById('messages');
    clarifications.forEach(c => {
      const card = document.createElement('div');
      card.className = 'bubble-row ai';
      card.innerHTML = `
        <div class="avatar">&#128210;</div>
        <div>
          <div class="clarify-card" id="clarify-${c.transaction_id}">
            <div class="clarify-title">&#9889; Amount needed</div>
            <div class="clarify-msg">${escHtml(c.message)}</div>
            <div class="clarify-row">
              <input type="number" placeholder="Enter amount" id="clarify-input-${c.transaction_id}" min="0" step="0.01" />
              <button class="clarify-submit" onclick="submitClarify(${c.transaction_id})">Submit</button>
            </div>
          </div>
        </div>`;
      box.appendChild(card);
    });
    scrollBottom();
  }

  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 5000);
  }

  async function pingServer() {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className = 'status-dot';
    text.textContent = 'Checking...';
    try {
      await fetch(getApiUrl() + '/docs', { method: 'HEAD', signal: AbortSignal.timeout(4000) });
      dot.className = 'status-dot ok';
      text.textContent = 'Connected';
    } catch {
      dot.className = 'status-dot err';
      text.textContent = 'Unreachable';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value  = '';
    autoResize(input);

    addBubble('user', text);
    addTyping();

    try {
      const res = await fetch(getApiUrl() + '/api/v1/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': uid() },
        body: JSON.stringify({ message: text, user_id: getUserId() }),
        signal: AbortSignal.timeout(30000),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addBubble('ai', 'Error ' + res.status + ': ' + (err.detail || res.statusText));
      } else {
        const data = await res.json();
        addBubble('ai', data.reply);
        if (data.clarifications && data.clarifications.length > 0) {
          addClarifyCard(data.clarifications);
        }
      }
    } catch (err) {
      removeTyping();
      if (err.name === 'TimeoutError') {
        addBubble('ai', 'Request timed out — is the server running?');
      } else {
        addBubble('ai', 'Could not reach the API: ' + err.message);
      }
    }

    btn.disabled = false;
    input.focus();
  }

  async function submitClarify(transactionId) {
    const input  = document.getElementById('clarify-input-' + transactionId);
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount <= 0) { showToast('Please enter a valid amount.'); return; }

    const card = document.getElementById('clarify-' + transactionId);
    card.style.opacity = '0.5';
    card.style.pointerEvents = 'none';

    try {
      const res = await fetch(getApiUrl() + '/api/v1/clarify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: transactionId, amount }),
        signal: AbortSignal.timeout(10000),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        showToast('Clarify failed: ' + (err.detail || res.statusText));
        card.style.opacity = '1';
        card.style.pointerEvents = '';
      } else {
        const data = await res.json();
        card.closest('.bubble-row').remove();
        addBubble('ai', data.reply);
      }
    } catch (err) {
      showToast('Error: ' + err.message);
      card.style.opacity = '1';
      card.style.pointerEvents = '';
    }
  }

  function toggleSidebarMenu() {
    const body = document.getElementById('sidebar-body');
    if (body) body.classList.toggle('open');
  }

  document.getElementById('msg-input').focus();
</script>
</body>
</html>
